<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>React practice</title>
  </head>
  <body>
    <!-- react app gets inserted here -->
    <div class="js-container"></div>
    <!-- react libraries -->
    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>
    <!-- chatbot library -->
    <script src="https://unpkg.com/supersimpledev/chatbot.js"></script>
    <!-- babel.jsx to convert jsx into normal js -->
    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <!-- all the jsx will be written here -->
    <script type="text/babel">
      //handle user input and sending messages
      function ChatInput({ chatMessages, setChatMessages }) {
        const [inputText, setInputText] = React.useState('');

        function saveInputText(event) {
          setInputText(event.target.value);
        }

        function sendMessage() {
          //user
          const newChatMessages = [
            ...chatMessages,
            {
              message: inputText,
              sender: "user",
              id: crypto.randomUUID(),
            },
          ];

          setChatMessages(newChatMessages);

          //getting reponse from chatbot library
          const response = Chatbot.getResponse(inputText);
          setChatMessages([
            ...newChatMessages,
            {
              message: response,
              sender: "robot",
              id: crypto.randomUUID(),
            },
          ]);

          setInputText('');
        }

        return (
          <>
            <input
              type="text"
              placeholder="Send a message to Chatbot"
              size="30"
              onChange={saveInputText}
              value={inputText}
            />
            <button 
                onClick={sendMessage}
            >Send</button>
          </>
        );
      }

      //display one single chat message
      //conditional rendering
      function ChatMessage({ message, sender }) {
        return (
          <div>
            {sender === "user" && <img src="user-image.png" width="50" />}
            {message}
            {sender === "robot" && <img src="robot-image.png" width="50" />}
          </div>
        );
      }

      //display all chat messages using map
      function ChatMessages({ chatMessages }) {
        return (
          <>
            {chatMessages.map((chatMessage) => {
              return (
                <ChatMessage
                  message={chatMessage.message}
                  sender={chatMessage.sender}
                  key={chatMessage.id}
                />
              );
            })}
          </>
        );
      }

      //main parent component
      function App() {
        const [chatMessages, setChatMessages] = React.useState([
          {
            message: "hello",
            sender: "user",
            id: "id1",
          },
          {
            message: "hi",
            sender: "robot",
            id: "id2",
          },
          {
            message: "how are you",
            sender: "user",
            id: "id3",
          },
          {
            message: "i am fine",
            sender: "robot",
            id: "id4",
          },
        ]);

        return (
          <>
            <ChatInput
              chatMessages={chatMessages}
              setChatMessages={setChatMessages}
            />
            <ChatMessages chatMessages={chatMessages} />
          </>
        );
      }

      //render react app
      const container = document.querySelector(".js-container");
      ReactDOM.createRoot(container).render(<App />);
    </script>
  </body>
</html>
