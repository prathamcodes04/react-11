<!doctype html>
<html>
  <head>
    <title>Chatbot</title>
  </head>
  <body>
    <div class="js-container"></div>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">
      function ChatInput() {
        return (
          <>
            <input
              type="text"
              placeholder="Send a message to Chatbot"
              size="30"
            />
            <button>Send</button>
          </>
        );
      }

      function ChatMessage({ message, sender }) {
        /*
        //here ChatMessage is a component
        //message and sender are the props object from which we are extracting value
        // const message = props.message;
        // const sender = props.sender;
        // const {message, sender} = props;
        /*
        /*
         if(sender === 'robot'){
            return (
               <div>
                  <img src="robot-image.png" width="50" />
                  {message}
               </div>
            );
         }
         */

        return (
          <div>
            {sender === "robot" && <img src="robot-image.png" width="50" />}
            {message}
            {sender === "user" && <img src="user-image.png" width="50" />}
          </div>
        );
      }

      //all chatdata is saved in this component 
      //and can be further used in app component
      function ChatMessages() {
        const chatMessages = [
         {
            message: "hello chatbot",
            sender: "user",
            id: "id1",
         },
         {
            message: "Hello! How can I help you?",
            sender: "robot",
            id: "id2",
         },
         {
            message: "Can you get me todays date?",
            sender: "user",
            id: "id3",
         },
         {
            message: "Today is September 27",
            sender: "robot",
            id: "id4",
         },];

         function sendmsg(){
            console.log('send msg');
         }

        return (
            <>
               <button onClick = {sendmsg}>Send message</button>

               {chatMessages.map((chatMessage) => {
               //here ChatMessage is an object
                  return (
                     <ChatMessage
                        message={chatMessage.message}
                        sender={chatMessage.sender}
                        key={chatMessage.id}
                     />
                  );
               })}
            </>
         );
      }

      //App is our main UI container
      //instead of variable we will use component to save our app
      //message, sender, key are the props here
      function App() {
        /*
        const chatMessageComponents = chatMessages.map((chatMessage) => {
          //here ChatMessage is an object
          return (
            <ChatMessage
              message={chatMessage.message}
              sender={chatMessage.sender}
            />
          );
        });
        */
        return (
          <>
            <ChatInput />
            <ChatMessages />
          </>
        );
      }

      /*
      const app = //stores UI
         (
            <>
            <ChatInput />
            <ChatMessage message="hello chatbot" sender="user" />
            <ChatMessage message="Hello! How can I help you?" sender="robot" />
            <ChatMessage message="Can you get me todays date?" sender="user" />
            <ChatMessage message="Today is September 27" sender="robot" />
            </>
      );
      */

      const container = document.querySelector(".js-container");
      ReactDOM.createRoot(container).render(<App />);
    </script>
  </body>
</html>
